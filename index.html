<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🤍 For Mom – Shailee, Jheel & Purvi</title>
    <!-- Font Awesome for cute icons (stickers) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(145deg, #ffe9f1 0%, #ffd9e5 100%);
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* main card – light pink dream */
        .love-card {
            max-width: 1000px;
            width: 100%;
            background: rgba(255, 240, 245, 0.75);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 60px 60px 60px 60px;
            box-shadow: 0 20px 40px rgba(255, 140, 180, 0.25),
                        0 8px 20px rgba(255, 120, 160, 0.15),
                        inset 0 2px 0 rgba(255, 255, 255, 0.7);
            padding: 2.5rem 2rem 3rem;
            border: 2px solid rgba(255, 220, 235, 0.6);
            transition: all 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        /* floating stickers (cute icons) */
        .sticker-pack {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .sticker {
            position: absolute;
            font-size: 2.6rem;
            opacity: 0.45;
            filter: drop-shadow(0 6px 10px rgba(255, 100, 150, 0.2));
            animation: floatSticker 12s infinite alternate ease-in-out;
            transform-origin: center;
        }

        .sticker:nth-child(1) { top: 8%; left: 5%; animation-duration: 14s; }
        .sticker:nth-child(2) { top: 12%; right: 6%; animation-duration: 16s; animation-delay: -3s; }
        .sticker:nth-child(3) { bottom: 18%; left: 7%; animation-duration: 18s; animation-delay: -6s; }
        .sticker:nth-child(4) { bottom: 22%; right: 5%; animation-duration: 13s; animation-delay: -2s; }
        .sticker:nth-child(5) { top: 45%; left: 2%; animation-duration: 15s; animation-delay: -8s; font-size: 2.2rem; }
        .sticker:nth-child(6) { top: 55%; right: 2%; animation-duration: 17s; animation-delay: -4s; font-size: 2rem; }
        .sticker:nth-child(7) { top: 30%; left: 50%; transform: translateX(-50%); animation-duration: 20s; font-size: 3rem; opacity: 0.25; }

        @keyframes floatSticker {
            0% { transform: translateY(0px) rotate(0deg) scale(1); }
            100% { transform: translateY(-25px) rotate(6deg) scale(1.08); }
        }

        /* content sits above stickers */
        .content {
            position: relative;
            z-index: 2;
        }

        /* header */
        .mom-header {
            text-align: center;
            margin-bottom: 2.8rem;
        }

        .mom-header h1 {
            font-size: 2.9rem;
            font-weight: 700;
            color: #b3406c;
            letter-spacing: -0.5px;
            text-shadow: 0 6px 14px rgba(255, 120, 170, 0.25);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.5);
            padding: 0.4rem 2.2rem;
            border-radius: 120px;
            backdrop-filter: blur(2px);
            box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.8);
        }

        .mom-header h1 i {
            font-size: 2.6rem;
            color: #ff80aa;
        }

        .sub-message {
            font-size: 1.3rem;
            color: #a05174;
            background: rgba(255, 220, 235, 0.6);
            display: inline-block;
            padding: 0.5rem 2rem;
            border-radius: 60px;
            margin-top: 0.6rem;
            backdrop-filter: blur(2px);
            font-weight: 500;
            letter-spacing: 0.3px;
            border: 1px solid rgba(255, 180, 200, 0.4);
        }

        /* daughters grid */
        .daughters-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 2rem 1.8rem;
            margin: 2.8rem 0 2.2rem;
        }

        .daughter-card {
            background: rgba(255, 245, 248, 0.7);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            padding: 1.8rem 1rem 2rem;
            border-radius: 48px 48px 48px 48px;
            box-shadow: 0 12px 28px rgba(255, 130, 170, 0.15),
                        0 2px 0 #fff8fa inset;
            border: 1px solid rgba(255, 220, 235, 0.5);
            text-align: center;
            transition: all 0.3s ease;
        }

        .daughter-card:hover {
            transform: translateY(-6px);
            background: rgba(255, 240, 245, 0.85);
            box-shadow: 0 20px 32px rgba(255, 100, 150, 0.2);
            border-color: #ffb0c8;
        }

        .daughter-icon {
            font-size: 4rem;
            margin-bottom: 0.2rem;
            display: block;
            filter: drop-shadow(0 6px 10px rgba(255, 70, 130, 0.2));
        }

        .daughter-name {
            font-size: 2rem;
            font-weight: 650;
            color: #8f3d5e;
            letter-spacing: 0.5px;
            border-bottom: 3px dashed #ffb6ce;
            display: inline-block;
            padding-bottom: 0.2rem;
            margin-bottom: 0.8rem;
        }

        .love-message {
            font-size: 1.2rem;
            font-weight: 500;
            color: #a34d72;
            background: rgba(255, 190, 215, 0.25);
            padding: 0.7rem 0.2rem;
            border-radius: 60px;
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin: 0.8rem 0 0.4rem;
        }

        .love-message i {
            color: #f25a8e;
            font-size: 1.8rem;
        }

        .love-meter {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            margin-top: 0.8rem;
        }

        .heart-sticker {
            color: #ff4d7a;
            font-size: 1.5rem;
            filter: drop-shadow(0 2px 6px rgba(255, 50, 100, 0.4));
            animation: pulseHeart 2s infinite alternate;
        }

        @keyframes pulseHeart {
            0% { transform: scale(0.95); opacity: 0.7; }
            100% { transform: scale(1.2); opacity: 1; }
        }

        /* special footer – mom's love note */
        .mom-love-note {
            background: rgba(255, 225, 235, 0.5);
            backdrop-filter: blur(2px);
            border-radius: 80px;
            padding: 1.2rem 2rem;
            text-align: center;
            border: 1px solid rgba(255, 200, 215, 0.5);
            margin-top: 2rem;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: center;
            gap: 0.6rem 1.4rem;
        }

        .mom-love-note span {
            font-size: 1.4rem;
            font-weight: 500;
            color: #852f55;
            letter-spacing: 0.3px;
        }

        .mom-love-note i {
            font-size: 2.2rem;
            color: #e0497a;
        }

        .big-heart {
            font-size: 2.6rem;
            margin: 0 0.2rem;
            color: #e63e74;
            animation: pulseHeart 1.8s infinite alternate;
        }

        /* responsive */
        @media (max-width: 600px) {
            .love-card { padding: 1.8rem 1rem; }
            .mom-header h1 { font-size: 2.2rem; padding: 0.4rem 1.2rem; }
            .daughters-grid { gap: 1.5rem; }
            .daughter-name { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

        <!-- floating cute stickers (many icons) -->
        <div class="sticker-pack">
            <span class="sticker"><i class="fas fa-heart" style="color: #ff7caa;"></i></span>

            <span class="sticker"><i class="fas fa-paw" style="color: #e8839f;"></i></span>
            <span class="sticker"><i class="fas fa-butterfly" style="color: #f58aa8;"></i></span>
            <span class="sticker"><i class="fas fa-cloud" style="color: #f7aec2;"></i></span>
            <span class="sticker"><i class="fas fa-rainbow" style="color: #f599b5;"></i></span>
        </div>

        <div class="content">

            <div class="mom-header">

            </div>

            <!-- three daughters -->
            <div class="daughters-grid">
                <!-- Shailee -->
                <div class="daughter-card">

                        <i class="fas fa-heart-circle-check"></i>

                    </div>
                    <div class="love-meter">
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span style="font-size:1.4rem; margin-left: 4px; color: #b34f72;">∞</span>
                    </div>
                    <div style="margin-top: 10px; font-size: 1.8rem; letter-spacing: 3px;">
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                    </div>
                </div>

                <!-- Jheel -->
                <div class="daughter-card">
                    <span class="daughter-icon"><i class="fas fa-sun" style="color: #f7a072;"></i></span>
                    <div class="daughter-name">Jheel</div>
                    <div class="love-message">
                        <i class="fas fa-heart-circle-check"></i> 
                        I love you, Mom!
                    </div>
                    <div class="love-meter">
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span style="font-size:1.4rem; margin-left: 4px; color: #b34f72;">∞</span>
                    </div>
                    <div style="margin-top: 10px; font-size: 1.8rem; letter-spacing: 3px;">
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                    </div>
                </div>

                <!-- Purvi -->
                <div class="daughter-card">
                    <span class="daughter-icon"><i class="fas fa-moon" style="color: #b87d9e;"></i></span>
                    <div class="daughter-name">Purvi</div>
                    <div class="love-message">
                        <i class="fas fa-heart-circle-check"></i> 
                        I love you, Mom!
                    </div>
                    <div class="love-meter">
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span class="heart-sticker"><i class="fas fa-heart"></i></span>
                        <span style="font-size:1.4rem; margin-left: 4px; color: #b34f72;">∞</span>
                    </div>
                    <div style="margin-top: 10px; font-size: 1.8rem; letter-spacing: 3px;">
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                        <i class="fas fa-sparkles" style="color: #f58aa8;"></i>
                    </div>
                </div>
            </div>

            <!-- mom love note: extra love from all three -->
            <div class="mom-love-note">
                <i class="fas fa-hand-holding-heart"></i>
                <span>Shailee · Jheel · Purvi </span>
                <i class="fas fa-heart" style="color:#f25a8e; font-size: 2rem;"></i>
                <span style="font-weight: 600;">together we love you, Mom</span>
                <span class="big-heart"><i class="fas fa-heart"></i></span>
                <span><i class="fas fa-ribbon" style="color: #dc6b8f;"></i></span>
                <span><i class="fas fa-gem" style="color: #dc6b8f;"></i></span>
                <i class="fas fa-kiss-wink-heart" style="color: #ec6088; font-size: 2rem;"></i>
            </div>

            <!-- tiny cute footer sticker line -->
            <div style="text-align: center; margin-top: 1.8rem; opacity: 0.7; letter-spacing: 12px; font-size: 1.6rem;">
                <i class="fas fa-kiwi-bird" style="color: #f58aa8;"></i>
                <i class="fas fa-candy-cane" style="color: #f58aa8;"></i>
                <i class="fas fa-cookie" style="color: #f58aa8;"></i>
                <i class="fas fa-ice-cream" style="color: #f58aa8;"></i>
                <i class="fas fa-cupcake" style="color: #f58aa8;"></i>
            </div>
        </div>
    </div>
</body>
</html>
